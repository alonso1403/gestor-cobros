<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

    <title>Gestor de Cobros</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>

<body>

    <!-- ======================================== -->
    <!-- LOGIN -->
    <!-- ======================================== -->

    <div id="login" class="card">

        <h2>Iniciar sesión</h2>

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="iniciarSesion()">
            Iniciar sesión
        </button>

        <!--<button onclick="registrarse()">
            Crear cuenta
        </button>-->

        <p id="mensajeLogin"></p>

    </div>


    <!-- ======================================== -->
    <!-- APLICACIÓN -->
    <!-- ======================================== -->

    <div id="app" style="display: none;">

    <h1>Gestor de Cobros</h1>
    <h1>Piwi Shop</h1>

<button class="btn-cerrar-sesion" onclick="cerrarSesion()">
    Cerrar sesión
</button>
    <!-- Nuevo Cliente -->

    <div class="card">

        <h2>Nuevo Cliente</h2>

        <input
            type="text"
            id="nombreCliente"
            placeholder="Nombre del cliente"
        >

        <input
            type="number"
            id="montoCuenta"
            placeholder="Monto total"
            min="0"
        >

<button onclick="guardarCliente()">
    
    Guardar Cliente
</button>

<!-- <button
    onclick="exportarClientesJSON()"

>
    Exportar clientes
</button>-->

<button

>
    Borrar datos de prueba

    </div>

    <!-- Buscar Cliente -->

    <div class="card">

        <h2>Buscar Cliente</h2>

        <input
            type="text"
            id="buscarCliente"
            placeholder="Buscar por nombre..."
            oninput="buscarCliente()"
        >

    </div>

    <!-- Clientes -->

    <div id="clientes">
    </div>

<!-- Respaldo -->
<div class="card">
    <h2>Respaldo</h2>

    <button onclick="exportarClientesJSON()"
    style="margin-top: 10px;"
    >
        Crear respaldo
    </button>

    <button onclick="importarClientesJSON()"
    style="margin-top: 10px;"
    >
        Importar respaldo
    </button>

    <button onclick="exportarClientesExcel()" style="margin-top: 10px;">
    Crear respaldo Excel
</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>

</body>

</html>
